<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read the Bhagavad Gita verse by verse, in Sanskrit, English and Hindi." />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Gita Verse</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      try {
        var theme = (JSON.parse(localStorage.getItem('gita.settings')) || {}).theme || 'system'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
